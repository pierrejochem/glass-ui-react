name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      # One matrix leg is enough to report coverage
      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The docs site deploys from main without the test gate, so its build has to
  # be proved here instead — on the PR, before it can break Pages
  docs:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: npm run docs:build

      - name: Assert the site is self-contained
        run: |
          test -f _site/index.html || { echo "missing _site/index.html"; exit 1; }
          test -f _site/liquid.css || { echo "missing _site/liquid.css"; exit 1; }
          test -f _site/.nojekyll || { echo "missing _site/.nojekyll"; exit 1; }
          if grep -q '\.\./src/' _site/index.html; then
            echo "the published page still points outside itself"
            exit 1
          fi
          echo "docs site verified"

      - name: Upload site for preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site/
          retention-days: 7

  # Catches the classic "it built on my machine but the tarball is empty" bug
  package:
    name: Pack and inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack --dry-run
      - name: Assert the entry points exist in the tarball
        run: |
          npm pack
          tar -tf liquid-glass-ui-*.tgz > files.txt
          for f in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts package/dist/styles/liquid.css; do
            grep -qx "$f" files.txt || { echo "missing $f from the published tarball"; exit 1; }
          done
          echo "tarball contents verified"
