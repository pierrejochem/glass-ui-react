name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # required for npm provenance
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer to exchange the Actions
      # OIDC token for a short-lived registry credential. Node 22 still bundles
      # npm 10, so the runner's npm is upgraded rather than the Node version,
      # which would change what the gate below runs against.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # A tag is not a licence to skip the gate: everything runs again here,
      # because CI ran against the branch, not necessarily against this commit.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Authentication is the OIDC exchange configured as a trusted publisher on
      # npm, so there is no token here. Provenance is attached automatically in
      # that flow; id-token: write above is what makes it possible.
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --access public

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm publish --dry-run
