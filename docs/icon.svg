<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="glass-ui-react">
  <title>glass-ui-react</title>
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1A1A1C"/>
      <stop offset="0.72" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B95FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5B95FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the pane: same gradient the card and the dark theme are built from -->
  <rect width="64" height="64" rx="15" fill="url(#pane)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#F2F1EF" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- lit: the one rule the library is built on -->
  <circle cx="32" cy="32" r="21" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="10" fill="#5B95FF"/>
</svg>
